name: iOS build (unsigned .ipa for sideloading)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'ios/**', 'package*.json', 'capacitor.config.json', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install and copy web app into the iOS project
        run: |
          npm ci
          npm run vendor
          npx cap sync ios

      - name: Build (no code signing; Sideloadly/AltStore signs it with your Apple ID)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          test -f Payload/App.app/public/index.html && test -f Payload/App.app/public/vendor/three.min.js
          zip -qry GOES-STAR.ipa Payload
          ls -lh GOES-STAR.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GOES-STAR-ipa
          path: GOES-STAR.ipa
          retention-days: 30
