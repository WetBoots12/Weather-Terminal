name: iOS build (unsigned .ipa for sideloading)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'ios/**', 'package*.json', 'capacitor.config.json', '.github/workflows/ios-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install and copy web app into the iOS project
        run: |
          npm ci
          npm run vendor
          npx cap sync ios

      - name: Build (no code signing; Sideloadly/AltStore signs it with your Apple ID)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          test -f Payload/App.app/public/index.html && test -f Payload/App.app/public/vendor/cesium/Cesium.js
          zip -qry GOES-STAR.ipa Payload
          ls -lh GOES-STAR.ipa

      - name: Checksums
        run: shasum -a 256 GOES-STAR.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GOES-STAR-ipa
          path: |
            GOES-STAR.ipa
            SHA256SUMS.txt
          retention-days: 30
