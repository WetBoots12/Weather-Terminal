name: macOS build (universal .dmg, ad-hoc signed)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'src-tauri/**', 'package*.json', 'scripts/**', '.github/workflows/macos-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install and vendor web app
        run: |
          npm ci
          npm run vendor

      - name: Build universal app and .dmg
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify bundle
        run: |
          set -e
          B=src-tauri/target/universal-apple-darwin/release/bundle
          APP=$(ls -d "$B"/macos/*.app | head -1)
          DMG=$(ls "$B"/dmg/*.dmg | head -1)
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          ARCHS=$(lipo -archs "$BIN"); echo "archs: $ARCHS"
          [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]]
          codesign --verify --verbose "$APP"
          hdiutil verify "$DMG"
          mkdir -p out && cp "$DMG" out/GOES-STAR-macOS-universal.dmg
          ls -lh out

      - name: Checksums
        run: cd out && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GOES-STAR-macOS-dmg
          path: |
            out/GOES-STAR-macOS-universal.dmg
            out/SHA256SUMS.txt
          retention-days: 30
