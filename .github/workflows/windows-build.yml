name: Windows build (installer)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'src-tauri/**', 'package*.json', 'scripts/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['app/**', 'src-tauri/**', 'package*.json', 'scripts/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Build installers (vendor step runs via beforeBuildCommand)
        run: npx tauri build --bundles nsis,msi

      - name: Verify web app is embedded
        shell: bash
        run: |
          set -e
          test -f app/vendor/three.min.js
          exe=src-tauri/target/release/goes-star.exe
          test -f "$exe"
          grep -aq "vendor/three.min.js" "$exe"
          grep -aq "/index.html" "$exe"
          ls -lh src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi

      - uses: actions/upload-artifact@v4
        with:
          name: GOES-STAR-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
