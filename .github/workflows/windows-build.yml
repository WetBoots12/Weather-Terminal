name: Windows build (installer)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'src-tauri/**', 'package*.json', 'scripts/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['app/**', 'src-tauri/**', 'package*.json', 'scripts/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Build installers (vendor step runs via beforeBuildCommand)
        run: npx tauri build --bundles nsis,msi

      - name: Verify web app is embedded
        shell: bash
        run: |
          set -e
          test -f app/vendor/cesium/Cesium.js
          exe=src-tauri/target/release/goes-star.exe
          test -f "$exe"
          grep -aq "vendor/cesium/Cesium.js" "$exe"
          grep -aq "/index.html" "$exe"
          ls -lh src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi

      - name: Checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          sha256sum nsis/*.exe msi/*.msi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GOES-STAR-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS.txt
          retention-days: 30
