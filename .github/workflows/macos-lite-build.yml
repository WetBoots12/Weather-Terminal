name: macOS Lite build (GOES-STAR Lite, universal .dmg)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'src-tauri/**', 'package*.json', 'scripts/**', 'assets/icon-lite.png', '.github/workflows/macos-lite-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install and vendor web app
        run: |
          npm ci
          npm run vendor

      - name: Build universal Lite app and .dmg
        run: npx tauri build --config src-tauri/tauri.lite.conf.json --target universal-apple-darwin --bundles app,dmg

      - name: Verify bundle
        run: |
          set -e
          B=src-tauri/target/universal-apple-darwin/release/bundle
          APP=$(ls -d "$B"/macos/*.app | head -1)
          DMG=$(ls "$B"/dmg/*.dmg | head -1)
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          ARCHS=$(lipo -archs "$BIN"); echo "archs: $ARCHS"
          [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]]
          codesign --verify --verbose "$APP"
          ID=$(defaults read "$PWD/$APP/Contents/Info" CFBundleIdentifier); echo "id: $ID"
          [[ "$ID" == "com.wetboots12.goesstar.lite" ]]
          grep -q "window.GS_LITE=true" dist-lite/index.html
          hdiutil verify "$DMG"
          mkdir -p out && cp "$DMG" out/GOES-STAR-Lite-macOS-universal.dmg
          ls -lh out

      - name: Checksums
        run: cd out && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GOES-STAR-Lite-macOS-dmg
          path: |
            out/GOES-STAR-Lite-macOS-universal.dmg
            out/SHA256SUMS.txt
          retention-days: 30
